<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEROHACK FREE KEY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(ellipse at 15% 20%, rgba(0, 255, 170, 0.13), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(0, 140, 255, 0.15), transparent 40%),
        linear-gradient(135deg, #05070b, #0b1018 50%, #030508);
}

/* Background glow */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.25;
    pointer-events: none;
}

body::before {
    background: #00ffaa;
    top: -150px;
    left: -100px;
}

body::after {
    background: #0077ff;
    right: -100px;
    bottom: -150px;
}

.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
}

.brand {
    font-size: clamp(36px, 9vw, 58px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 25px rgba(0, 255, 170, 0.25);
}

.brand span {
    color: #00ffaa;
}

.subtitle {
    margin-top: 12px;
    margin-bottom: 38px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #9ca9b8;
}

.card {
    padding: 28px 22px;
    border: 1px solid rgba(0, 255, 170, 0.25);
    border-radius: 18px;
    background: rgba(12, 18, 27, 0.82);
    box-shadow:
        0 0 40px rgba(0, 255, 170, 0.06),
        0 20px 60px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(15px);
}

.label {
    margin-bottom: 14px;
    color: #8d9bab;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
}

.key-box {
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 7px;
    border: 1px solid #263443;
    border-radius: 12px;
    background: #070b11;
}

.key {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 5px;
    color: #e8fff7;
    font-size: clamp(12px, 3vw, 15px);
    font-weight: 700;
    letter-spacing: 0.5px;
    overflow-wrap: anywhere;
    user-select: text;
}

.copy-btn {
    min-width: 85px;
    padding: 0 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #00ffaa, #00d5a0);
    color: #04100c;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.copy-btn:hover {
    box-shadow: 0 0 22px rgba(0, 255, 170, 0.3);
    transform: translateY(-1px);
}

.copy-btn:active {
    transform: scale(0.96);
}

.copy-btn.copied {
    background: #d9fff1;
}

.message {
    min-height: 18px;
    margin-top: 16px;
    color: #00ffaa;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

@media (max-width: 380px) {
    .card {
        padding: 22px 12px;
    }

    .key-box {
        gap: 6px;
        padding: 5px;
    }

    .copy-btn {
        min-width: 72px;
        padding: 0 9px;
    }

    .subtitle {
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>

<main class="container">

    <h1 class="brand">NERO<span>HACK</span></h1>

    <p class="subtitle">NEROHACK FREE KEY</p>

    <section class="card">

        <p class="label">YOUR ACCESS KEY</p>

        <div class="key-box">

            <!-- Change the key below whenever needed -->
            <div class="key" id="key">
                NEROHACK-1D-490C9C4
            </div>

            <button
                type="button"
                class="copy-btn"
                id="copyBtn"
                onclick="copyKey()">
                COPY
            </button>

        </div>

        <p class="message" id="message" aria-live="polite"></p>

    </section>

</main>

<script>
async function copyKey() {
    const key = document.getElementById("key").textContent.trim();
    const button = document.getElementById("copyBtn");
    const message = document.getElementById("message");

    let copied = false;

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(key);
            copied = true;
        } else {
            copied = fallbackCopy(key);
        }
    } catch (error) {
        copied = fallbackCopy(key);
    }

    if (!copied) {
        message.textContent = "Copy failed — please copy the key manually.";
        return;
    }

    button.textContent = "COPIED ✓";
    button.classList.add("copied");
    message.textContent = "KEY COPIED SUCCESSFULLY";

    setTimeout(() => {
        button.textContent = "COPY";
        button.classList.remove("copied");
        message.textContent = "";
    }, 2000);
}

function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    let success = false;

    try {
        success = document.execCommand("copy");
    } catch (error) {
        success = false;
    }

    textarea.remove();
    return success;
}
</script>

</body>
</html>
